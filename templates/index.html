<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Music App</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #121212;
  color: white;
}

/* HEADER */
header {
  padding: 15px;
  background: #1db954;
  font-size: 20px;
  font-weight: bold;
}

/* MAIN LAYOUT */
.container {
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 200px;
  background: #000;
  height: 100vh;
  padding: 20px;
}

.sidebar h3 {
  margin-bottom: 20px;
}

.sidebar button {
  width: 100%;
  margin-bottom: 10px;
  padding: 10px;
  background: #1db954;
  border: none;
  color: white;
  cursor: pointer;
}

/* CONTENT */
.content {
  flex: 1;
  padding: 20px;
}

/* UPLOAD BOX */
.upload-box {
  background: #181818;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
}

input {
  margin: 5px;
  padding: 8px;
  border-radius: 5px;
  border: none;
}

button {
  padding: 8px 12px;
  border-radius: 5px;
  border: none;
  cursor: pointer;
  background: #1db954;
  color: white;
}

/* SONG LIST */
.song-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 15px;
}

.song-card {
  background: #181818;
  padding: 15px;
  border-radius: 10px;
  transition: 0.2s;
}

.song-card:hover {
  background: #282828;
}

.song-title {
  font-weight: bold;
}

.play-btn {
  margin-top: 10px;
  width: 100%;
}

/* PLAYER */
.player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #181818;
  padding: 10px;
  text-align: center;
}
</style>
</head>

<body>

<header>🎧 My Music App</header>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h3>Menu</h3>
    <button onclick="loadSongs()">🎵 Bài hát</button>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- UPLOAD -->
    <div class="upload-box">
      <h3>Upload bài hát</h3>
      <input type="text" id="title" placeholder="Tên bài">
      <input type="text" id="artist" placeholder="Ca sĩ">
      <input type="file" id="file">
      <button onclick="upload()">Upload</button>
    </div>

    <!-- SONG LIST -->
    <div class="song-list" id="list"></div>

  </div>

</div>

<!-- PLAYER -->
<div class="player">
  <audio id="player" controls style="width:80%;"></audio>
</div>

<script>
const API_URL = "http://127.0.0.1:5000";

// Upload
function upload() {
  const file = document.getElementById("file").files[0];

  if (!file) {
    alert("Chọn file trước!");
    return;
  }

  const formData = new FormData();
  formData.append("song", file);
  formData.append("title", document.getElementById("title").value);
  formData.append("artist", document.getElementById("artist").value);

  fetch(API_URL + "/api/songs", {
    method: "POST",
    body: formData
  })
  .then(res => res.json())
  .then(() => {
    alert("Upload thành công!");
    loadSongs();
  });
}

// Load songs
function loadSongs() {
  fetch(API_URL + "/api/songs")
    .then(res => res.json())
    .then(data => {
      const list = document.getElementById("list");
      list.innerHTML = "";

      data.forEach(song => {
        const card = document.createElement("div");
        card.className = "song-card";

        card.innerHTML = `
          <div class="song-title">${song.title}</div>
          <div>${song.artist}</div>
          <button class="play-btn" onclick="play('${song.fileUrl}')">▶ Play</button>
        `;

        list.appendChild(card);
      });
    });
}

// Play
function play(url) {
  const player = document.getElementById("player");
  player.src = API_URL + url;
  player.play();
}

window.onload = loadSongs;
</script>

</body>
</html>
