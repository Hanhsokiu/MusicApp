<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music App - Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

  <div class="sidebar">
  <div class="logo">
    <i class="fab fa-spotify" style="color: var(--primary-color); font-size: 32px;"></i>
    MusicAPI
  </div>

  <button class="nav-btn active" onclick="loadSongs()">
    <i class="fas fa-home"></i> Trang chủ
  </button>

  <button class="nav-btn">
    <i class="fas fa-search"></i> Tìm kiếm
  </button>

  <!-- 📚 THƯ VIỆN -->
  <button class="nav-btn" onclick="toggleLibrary()">
    <i class="fas fa-book"></i> Thư viện
  </button>

  <!-- 👇 MENU CON -->
  <div id="libraryMenu" style="display:none; margin-left:15px;">
    <button class="nav-btn" onclick="loadFavorites()">
      <i class="fas fa-heart"></i> Yêu thích
    </button>

    <button class="nav-btn" onclick="loadRecent()">
      <i class="fas fa-clock"></i> Gần đây
    </button>
  </div>

</div>



  <div class="main-content">


     <div class="user-bar">
  <span id="userName"></span>
  <span id="userRole" class="role-badge"></span>
  <button class="nav-btn" onclick="logout()">
  <i class="fas fa-sign-out-alt"></i> Đăng xuất
</button>


</div>
    <div class="search-box">
          <i class="fas fa-search search-icon"></i>
          <input type="text" id="searchInput" placeholder="Bạn muốn nghe bài gì hôm nay?" oninput="searchSongs()">
    </div>

    <button class="nav-btn" onclick="goToUpload()">
  <i class="fas fa-cloud-upload-alt"></i> Tải nhạc
</button>


    <h2 class="header-title">Danh sách bài hát</h2>

    <div class="song-list" id="list">
      </div>

  </div>

  <div class="player-bar">
    <audio id="player" controls controlsList="nodownload"></audio>
  </div>



  <!-- EDIT MODAL -->
<div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:2000; justify-content:center; align-items:center;">

  <div style="background:#181818; padding:25px; border-radius:10px; width:400px;">
    <h3 style="margin-bottom:15px;">✏️ Sửa bài hát</h3>

    <input type="text" id="editTitle" placeholder="Tên bài hát" style="width:100%; margin-bottom:10px; padding:10px;">
    <input type="text" id="editArtist" placeholder="Tên ca sĩ" style="width:100%; margin-bottom:10px; padding:10px;">

    <label>File nhạc mới:</label>
    <input type="file" id="editFile" style="margin-bottom:10px;">

    <label>Ảnh mới:</label>
    <input type="file" id="editImage" style="margin-bottom:15px;">

    <div style="display:flex; justify-content:space-between;">
      <button onclick="submitEdit()" style="background:#1db954; padding:10px 15px; border:none; border-radius:5px;">Lưu</button>
      <button onclick="closeModal()" style="background:#444; padding:10px 15px; border:none; border-radius:5px;">Hủy</button>
    </div>
  </div>

</div>

 <script src="/static/script.js"></script>
</body>
</html>
