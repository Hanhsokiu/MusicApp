<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Upload bài hát</title>
  <link rel="stylesheet" href="/static/style.css">
    <style>
:root {
    --bg-base: #090909;
    --bg-panel: #121212;
    --primary-color: #1ed760;
    --primary-glow: rgba(30, 215, 96, 0.4);
    --text-main: #ffffff;
    --text-muted: #a7a7a7;
    --glass-bg: rgba(18, 18, 18, 0.7);
    --glass-border: rgba(255, 255, 255, 0.1);
    --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--bg-base);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    /* Premium dark gradient */
    background: radial-gradient(circle at top left, #1a1a2e 0%, var(--bg-base) 60%);
}

.main-content {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.upload-container {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* Premium Upload Card */
.upload-card {
    background: var(--glass-bg);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid var(--glass-border);
    padding: 40px;
    border-radius: 24px;
    width: min(450px, 100%);
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
    overflow: hidden;
    animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

.upload-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at center, rgba(30, 215, 96, 0.03), transparent 70%);
    pointer-events: none;
}

.upload-card h2 {
    text-align: center;
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
    background: linear-gradient(to right, #fff, #a7a7a7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Input Styling */
.upload-card input[type="text"] {
    width: 100%;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: white;
    padding: 14px 18px;
    border-radius: 12px;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    transition: var(--transition);
    outline: none;
}

.upload-card input[type="text"]:focus {
    background: rgba(255, 255, 255, 0.1);
    border-color: var(--primary-color);
    box-shadow: 0 0 0 4px rgba(30, 215, 96, 0.15);
}

/* File Input */
.upload-card input[type="file"] {
    width: 100%;
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
}

.upload-card input[type="file"]::file-selector-button {
    background: rgba(255, 255, 255, 0.1);
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    margin-right: 12px;
    transition: var(--transition);
    font-family: 'Poppins', sans-serif;
}

.upload-card input[type="file"]::file-selector-button:hover {
    background: rgba(255, 255, 255, 0.2);
}

/* Buttons */
.btn-upload {
    background: linear-gradient(45deg, var(--primary-color), #20e3b2);
    color: #000;
    border: none;
    padding: 16px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: 0 8px 16px rgba(30, 215, 96, 0.25);
    margin-top: 10px;
}

.btn-upload:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 12px 24px rgba(30, 215, 96, 0.4);
}

.btn-upload:active {
    transform: translateY(0) scale(0.98);
}

.back-btn {
    background: rgba(255, 255, 255, 0.08);
    border: none;
    padding: 12px;
    border-radius: 30px;
    color: var(--text-main);
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.back-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateY(-2px);
}

/* Animation */
@keyframes slideUpFade {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

    </style>
</head>

<body>

<div class="main-content">
  <div class="upload-container">

    <div class="upload-card">
      <h2>🎵 Upload bài hát</h2>

      <input type="text" id="title" placeholder="Tên bài hát">
      <input type="text" id="artist" placeholder="Tên ca sĩ">
      <p>File nhạc</p>
      <input type="file" id="file" accept=".mp3,.wav">
      <p>Ảnh</p>
      <input type="file" id="image" accept="image/*">

      <button class="btn-upload" onclick="upload()">Tải lên</button>
      <button class="back-btn" onclick="goHome()">⬅ Quay lại</button>
    </div>

  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/static/script.js"></script>

</body>
</html>
